                  import: section_options
            legal_text:
              display: 'Legal text'
              instructions: 'The page title, the date it was last saved, and long text (a privacy policy, terms).'
              icon: text-formatting-paragraph
              fields:
                -
                  handle: content
                  field:
                    type: markdown
                    display: Text
                -
                  import: section_options
