            offices:
              display: Offices
              instructions: 'Office addresses in cards.'
              icon: pin
              fields:
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                -
                  handle: intro
                  field:
                    type: textarea
                    display: Text
                -
                  handle: offices
                  field:
                    type: grid
                    display: Offices
                    mode: stacked
                    fields:
                      -
                        handle: flag
                        field:
