title: 'Download requests'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: material_title
            field:
              type: text
              display: Material
              instructions: 'Filled in by the site from the material asked for.'
              listable: true
              validate:
                - nullable
                - string
                - 'max:255'
          -
            handle: material
            field:
              type: text
              display: 'Material (entry ID)'
              instructions: 'The downloadable material asked for.'
              listable: false
              validate:
                - required
                - string
                - 'max:64'
          -
            handle: name
            field:
              listable: true
              type: text
              display: Name
              validate:
                - required
                - string
                - 'max:120'
          -
            handle: email
            field:
              listable: true
              type: text
              input_type: email
              display: 'Work email'
              validate:
                - required
                - email
                - 'max:255'
          -
            handle: company
            field:
              listable: true
              type: text
              display: Company
              validate:
                - required
                - string
                - 'max:160'
