title: Contact
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              listable: true
              type: text
              display: Name
              validate:
                - required
                - string
                - 'max:120'
          -
            handle: email
            field:
              listable: true
              type: text
              input_type: email
              display: 'Work email'
              validate:
                - required
                - email
                - 'max:255'
          -
            handle: company
            field:
              listable: true
              type: text
              display: Company
              validate:
                - required
                - string
                - 'max:160'
          -
            handle: phone
            field:
              type: text
              display: Phone
              validate:
                - nullable
                - string
                - 'max:40'
          -
            handle: interest
            field:
              listable: true
              type: select
              display: 'Interested in'
              options:
                demo: 'A demo'
                pricing: Pricing
                integration: 'SDK integration'
                partnership: Partnership
                other: Something else
              validate:
                - required
                - 'in:demo,pricing,integration,partnership,other'
          -
            handle: message
            field:
              type: textarea
              display: Message
              validate:
                - required
                - string
                - 'max:5000'
